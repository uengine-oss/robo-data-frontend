<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modeling dialog lifecycle contract</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mountModelingDialogLifecycleHarness } from './modeling-dialog-lifecycle-harness.ts'

      const root = document.querySelector('#app')
      if (!root) throw new Error('Harness root is missing')
      window.__unmountModelingDialogLifecycleHarness = mountModelingDialogLifecycleHarness(root)
    </script>
  </body>
</html>
